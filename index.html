<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US English Master Pro</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --accent: #f59e0b;
            --bg-gradient: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1350&q=80');
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #fff;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        header h1 {
            font-size: 1.4rem;
            color: #60a5fa;
            text-align: center;
            margin: 0 0 4px 0;
        }

        header p {
            text-align: center;
            color: #cbd5e1;
            font-size: 0.8rem;
            margin-bottom: 14px;
        }

        .category-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .cat-btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
        }

        .video-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 14px;
            border: 1px solid #475569;
        }

        .video-section h3 {
            font-size: 0.9rem;
            margin: 0 0 6px 0;
            color: #f8fafc;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .video-desc {
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 6px 0 0 0;
            text-align: center;
        }

        .card-section h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .vocab-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .v-card {
            background: var(--card-bg);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .v-card:active {
            transform: scale(0.98);
        }

        .word-main {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .word-sub {
            font-size: 0.75rem;
            color: #64748b;
        }

        .level-tag {
            background: #e2e8f0;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: #0f172a;
        }

        .millonario-box {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            border: 2px solid var(--accent);
            padding: 12px;
            border-radius: 14px;
            margin-top: 14px;
        }

        .millonario-box h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
            color: var(--accent);
            text-align: center;
        }

        .prize-badge {
            text-align: center;
            font-size: 0.75rem;
            color: #fde047;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .question-text {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .options-container button {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: left;
            transition: background 0.2s;
        }

        .options-container button:hover {
            background: rgba(255,255,255,0.25);
        }

        #mFeedback {
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>US English Master Pro</h1>
        <p>A2 to C2 • Industrial, Business, Travel & Daily Life</p>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="changeCategory('all', event)">All</button>
        <button class="cat-btn" onclick="changeCategory('travel', event)">Travel</button>
        <button class="cat-btn" onclick="changeCategory('work', event)">Business & Industrial</button>
        <button class="cat-btn" onclick="changeCategory('daily', event)">Daily & Home</button>
        <button class="cat-btn" onclick="changeCategory('sports', event)">Sports</button>
    </div>

    <div class="video-section">
        <h3>Live Speaking (US English)</h3>
        <div class="video-wrapper">
            <iframe id="youtubePlayer" src="https://www.youtube.com/embed/5qap5aO4i9A" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <p id="videoCaption" class="video-desc">Context: Immersion and listening practice in the US.</p>
    </div>

    <div class="card-section">
        <h3>Advanced Vocabulary & Meaning (Tap to listen)</h3>
        <div class="vocab-grid" id="vocabGrid"></div>
    </div>

    <div class="millonario-box">
        <h3>Millionaire Challenge (Levels A2 to C2)</h3>
        <div class="prize-badge" id="prizeLevel">Question 1 of 4 ($1,000)</div>
        <div class="question-text" id="mQuestion">Loading challenge...</div>
        <div class="options-container" id="mOptions"></div>
        <div id="mFeedback"></div>
    </div>
</div>

<script>
    const database = [
        { word: "Layover", cat: "travel", level: "B1", trans: "Flight connection stop", meaning: "A stop between flights.", audio: "Layover" },
        { word: "Itinerary", cat: "travel", level: "B2", trans: "Travel route plan", meaning: "A planned route or journey.", audio: "Itinerary" },
        { word: "Red-eye flight", cat: "travel", level: "C1", trans: "Night flight", meaning: "A flight that takes off at night and arrives early morning.", audio: "Red-eye flight" },
        { word: "Streamline", cat: "work", level: "C1", trans: "Optimize processes", meaning: "To make an organization or process more efficient.", audio: "Streamline" },
        { word: "Assembly line", cat: "work", level: "B1", trans: "Factory manufacturing line", meaning: "A series of workers and machines in a factory.", audio: "Assembly line" },
        { word: "Benchmark", cat: "work", level: "B2", trans: "Standard of reference", meaning: "A standard or point of reference against which things may be compared.", audio: "Benchmark" },
        { word: "Procurement", cat: "work", level: "C2", trans: "Industrial sourcing", meaning: "The action of obtaining or procuring goods, especially for business.", audio: "Procurement" },
        { word: "Commute", cat: "daily", level: "A2", trans: "Daily travel to work", meaning: "Regular journey of traveling some distance to work.", audio: "Commute" },
        { word: "Pantry", cat: "daily", level: "B1", trans: "Food storage closet", meaning: "A small room or closet in which food is kept.", audio: "Pantry" },
        { word: "Landlord", cat: "daily", level: "B2", trans: "Property owner", meaning: "A person who rents out land, a building, or apartment.", audio: "Landlord" },
        { word: "Underdog", cat: "sports", level: "B2", trans: "Unlikely winner", meaning: "A competitor thought to have little chance of winning a fight or contest.", audio: "Underdog" },
        { word: "Overtime", cat: "sports", level: "A2", trans: "Extra playing time", meaning: "Extra time played in a game to break a tie.", audio: "Overtime" }
    ];

    const videosMap = {
        all: { id: "5qap5aO4i9A", desc: "General context: American English live." },
        travel: { id: "1WKQr7jZ2kE", desc: "US Context: English in airports and travel." },
        work: { id: "35q7kW5zhjQ", desc: "US Context: Business English and workplaces." },
        daily: { id: "r9j8Z5b4C3E", desc: "US Context: Everyday conversations at home." },
        sports: { id: "2Vv-BfVoq4g", desc: "US Context: Sports, energy and expressions." }
    };

    function speakUS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderVocab(category = 'all') {
        const grid = document.getElementById('vocabGrid');
        grid.innerHTML = '';
        
        const filtered = category === 'all' ? database : database.filter(item => item.cat === category);

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'v-card';
            card.innerHTML = `
                <div>
                    <span class="word-main">${item.word}</span>
                    <div class="word-sub">${item.trans} (${item.meaning})</div>
                </div>
                <span class="level-tag">${item.level}</span>
            `;
            card.onclick = () => speakUS(item.audio);
            grid.appendChild(card);
        });

        const iframe = document.getElementById('youtubePlayer');
        const cap = document.getElementById('videoCaption');
        if(videosMap[category]) {
            iframe.src = `https://www.youtube.com/embed/${videosMap[category].id}?autoplay=0&mute=0`;
            cap.textContent = videosMap[category].desc;
        }
    }

    function changeCategory(cat, event) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderVocab(cat);
    }

    const millonarioQuestions = [
        {
            q: "What is the industrial meaning of 'Streamline' (C1)?",
            prize: "Question 1 ($1,000)",
            options: ["Make a process more efficient", "Break heavy machinery", "Hire more personnel"],
            correct: 0
        },
        {
            q: "In American business, what does 'Procurement' refer to? (C2)",
            prize: "Question 2 ($8,000)",
            options: ["Firing employees", "Obtaining goods and services", "Marketing strategy"],
            correct: 1
        },
        {
            q: "What does 'Layover' mean during a US trip? (B1)",
            prize: "Question 3 ($32,000)",
            options: ["A direct flight", "A stop between flights", "A lost baggage"],
            correct: 1
        },
        {
            q: "Choose the best synonym for 'Benchmark' (B2):",
            prize: "Question 4 ($125,000)",
            options: ["A random guess", "A standard of excellence", "A broken tool"],
            correct: 1
        }
    ];

    let mIndex = 0;
    function loadMillonario() {
        const currentQ = millonarioQuestions[mIndex];
        document.getElementById('prizeLevel').textContent = currentQ.prize;
        document.getElementById('mQuestion').textContent = currentQ.q;
        document.getElementById('mFeedback').textContent = "";
        
        const optContainer = document.getElementById('mOptions');
        optContainer.innerHTML = "";
        
        currentQ.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.onclick = () => {
                if(idx === currentQ.correct) {
                    document.getElementById('mFeedback').style.color = "#4ade80";
                    document.getElementById('mFeedback').textContent = "Correct! Moving to the next level.";
                    setTimeout(() => {
                        mIndex = (mIndex + 1) % millonarioQuestions.length;
                        loadMillonario();
                    }, 1500);
                } else {
                    document.getElementById('mFeedback').style.color = "#f87171";
                    document.getElementById('mFeedback').textContent = "Incorrect. Try again.";
                }
            };
            optContainer.appendChild(btn);
        });
    }

    renderVocab('all');
    loadMillonario();
</script>

</body>
</html>
